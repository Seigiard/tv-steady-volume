name: Release

# A tag v<major>.<minor>.<patch>[-suffix] builds a signed APK and publishes a GitHub Release.
# versionCode = major*10000 + minor*100 + patch. A suffix (v0.3.0-rc1) marks a pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          IFS=. read -r major minor patch <<< "$base"
          for n in "$major" "$minor" "$patch"; do
            [[ "$n" =~ ^[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1; }
          done
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed APK
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionName="${{ steps.v.outputs.name }}" \
            -PversionCode="${{ steps.v.outputs.code }}"
          cp app/build/outputs/apk/release/app-release.apk "steadyvolume-${{ steps.v.outputs.name }}.apk"
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Publish release
        run: |
          flags=(--generate-notes --title "${{ steps.v.outputs.name }}")
          [[ "${{ steps.v.outputs.prerelease }}" == "true" ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "steadyvolume-${{ steps.v.outputs.name }}.apk" "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
